<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Wheel tracks -->
  <rect x="6" y="34" width="36" height="4" rx="1" fill="#67B26F"/>
  <!-- Body -->
  <rect x="10" y="14" width="24" height="18" rx="3" fill="#4CAF50"/>
  <!-- Handle -->
  <rect x="30" y="6" width="14" height="3" rx="1.5" fill="#78909C"/>
  <rect x="41" y="9" width="3" height="13" rx="1" fill="#78909C"/>
  <!-- Rear wheel -->
  <circle cx="16" cy="32" r="4" fill="#455A64"/>
  <circle cx="16" cy="32" r="2" fill="#78909C"/>
  <!-- Front wheel -->
  <circle cx="28" cy="32" r="4" fill="#455A64"/>
  <circle cx="28" cy="32" r="2" fill="#78909C"/>
  <!-- Grass stripes on body -->
  <rect x="14" y="18" width="16" height="2" rx="1" fill="#81C784" opacity=".7"/>
  <rect x="14" y="23" width="16" height="2" rx="1" fill="#81C784" opacity=".7"/>
